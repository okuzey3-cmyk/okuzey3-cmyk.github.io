<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gep Gep">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Gep Gep</title>
<style>
  :root{
    --bg:#f4efe6; --paper:#fffcf7; --ink:#1c1916; --ink2:#5d564d; --ink3:#9a9185; --line:#e7dfd2;
    --accent:#c4552d; --accent-soft:rgba(196,85,45,.10); --ok:#5f8a4a;
    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14120f; --paper:#1e1b17; --ink:#f3eee6; --ink2:#c2b9ab; --ink3:#857c70; --line:#2e2a24; --accent-soft:rgba(196,85,45,.18); }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
       padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 6px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.03em}
  .logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
  .logo i::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 3px var(--accent), 0 0 0 5px var(--bg)}
  .lang{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:3px}
  .lang button{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--ink3)}
  .lang button.on{background:var(--ink);color:var(--bg)}

  .hero{padding:26px 0 22px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
  .hero h1{font-family:var(--serif);font-size:48px;font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:8px 0 8px}
  .hero p{color:var(--ink2);font-size:16px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px}
  .now{padding:20px 20px 22px;position:relative;overflow:hidden}
  .now .tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.06em;
            text-transform:uppercase;color:var(--accent)}
  .now .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .now.here .tag{color:var(--ok)} .now.here .tag::before{background:var(--ok);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,138,74,.5)}100%{box-shadow:0 0 0 9px rgba(95,138,74,0)}}
  .now h2{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:10px 0 4px}
  .now .meta{font-size:14px;color:var(--ink3)}
  .now .row{display:flex;align-items:center;gap:14px;margin-top:18px}
  .play{width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;
        box-shadow:0 8px 20px -8px rgba(196,85,45,.7);transition:transform .15s}
  .play:active{transform:scale(.94)}
  .play svg{width:22px;height:22px}
  .row .lbl b{display:block;font-size:16px}
  .row .lbl span{font-size:13px;color:var(--ink3)}
  .story{margin-top:18px;font-family:var(--serif);font-size:17.5px;line-height:1.6;color:var(--ink);display:none}
  .story.open{display:block}
  .toggle{margin-top:14px;font-size:14px;font-weight:600;color:var(--accent)}

  .locate{width:100%;margin-top:14px;padding:15px;border-radius:16px;border:1px dashed var(--line);color:var(--ink2);
          font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
  .note{margin-top:12px;font-size:13.5px;color:var(--ink3);text-align:center}

  section{margin-top:36px}
  .sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .sh h3{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
  .sh span{font-size:13px;color:var(--ink3)}
  .route{overflow:hidden}
  .stop{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line);width:100%;text-align:left}
  .stop:last-child{border-bottom:none}
  .stop .n{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
           font-size:13px;font-weight:700;color:var(--ink2);flex:none}
  .stop.sel .n{background:var(--accent);border-color:var(--accent);color:#fff}
  .stop .t{flex:1;min-width:0}
  .stop .t b{display:block;font-weight:600;font-size:15.5px}
  .stop .t span{display:block;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stop .d{font-size:13px;color:var(--ink3);flex:none}

  nav{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
      border-top:1px solid var(--line)}
  nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
  nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 14px}
  nav button svg{width:24px;height:24px}
  nav button.on{color:var(--accent)}
  nav button.soon{opacity:.45}
  nav button small{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i></i>gep gep</div>
    <div class="lang"><button data-l="tr" class="on">TR</button><button data-l="en">EN</button></div>
  </header>

  <div class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Galata</h1>
    <p id="intro"></p>
  </div>

  <div class="card now" id="now"></div>
  <button class="locate" id="locate"></button>
  <p class="note" id="note"></p>

  <section>
    <div class="sh"><h3 id="routeTitle"></h3><span id="routeMeta"></span></div>
    <div class="card route" id="route"></div>
  </section>
</div>

<nav><div class="in">
  <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="tabGezi"></span></button>
  <button class="soon" data-soon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span id="tabSky"></span></button>
  <button class="soon" data-soon><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg><span id="tabShop"></span></button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
const STOPS = [
  { id:"kule", lat:41.02560, lng:28.97415,
    tr:{ ad:"Galata Kulesi", kisa:"Cenevizlilerin 1348'de diktiği kule",
      metin:"Galata Kulesi, 1348 yılında Cenevizliler tarafından Galata surlarının en yüksek noktası olarak inşa edildi. O dönemki adı, İsa Kulesi anlamına gelen Christea Turris'ti. Osmanlı döneminde gözetleme ve yangın kulesi olarak kullanıldı; şehirde çıkan yangınlar buradan görülüp haber veriliyordu. Evliya Çelebi, on yedinci yüzyılda Hezârfen Ahmed Çelebi'nin kendi yaptığı kanatlarla bu kuleden atlayıp Üsküdar'a süzüldüğünü anlatır. Bunun gerçek mi efsane mi olduğu hâlâ tartışılır. Yaklaşık altmış yedi metre yüksekliğindeki kule bugün müze olarak ziyaret ediliyor; tepesindeki terastan Haliç, Boğaz ve Tarihi Yarımada tek bakışta görülüyor." },
    en:{ ad:"Galata Tower", kisa:"Built by the Genoese in 1348",
      metin:"Galata Tower was built by the Genoese in 1348 as the highest point of the Galata walls. Its name at the time was Christea Turris, the Tower of Christ. Under the Ottomans it served as a watchtower for fires; blazes anywhere in the city were spotted and announced from here. The traveller Evliya Çelebi wrote that in the seventeenth century Hezârfen Ahmed Çelebi leapt from this tower on wings he had made himself and glided across to Üsküdar. Whether it really happened is still debated. About sixty-seven metres tall, the tower is now a museum, and its top terrace takes in the Golden Horn, the Bosphorus and the historic peninsula in a single view." } },
  { id:"kamondo", lat:41.02443, lng:28.97482,
    tr:{ ad:"Kamondo Merdivenleri", kisa:"Bir banker ailesinin kıvrımlı kestirmesi",
      metin:"Bankalar Caddesi'ni Galata'nın yokuşlarına bağlayan bu kıvrımlı merdivenler, on dokuzuncu yüzyılın sonlarında Osmanlı'nın önde gelen bankerlerinden Kamondo ailesi tarafından yaptırıldı. Anlatılana göre aile, evleri ile bankaları arasında kısa bir yol istiyordu. Birbirine dolanan basamakları ve sade demir korkulukları, merdivenleri İstanbul'un en çok fotoğraflanan köşelerinden biri yaptı. Fransız fotoğrafçı Henri Cartier-Bresson'un 1964'te burada çektiği kare, bu merdivenleri dünyaya tanıttı." },
    en:{ ad:"Camondo Stairs", kisa:"A banking family's winding shortcut",
      metin:"These curving stairs, linking Bankalar Street to the slopes of Galata, were built in the late nineteenth century by the Camondos, one of the leading banking families of the Ottoman Empire. The story goes that the family wanted a short way between their home and their bank. With their intertwining steps and simple iron railings, the stairs became one of the most photographed corners of Istanbul. A 1964 photograph taken here by the French photographer Henri Cartier-Bresson made them known around the world." } },
  { id:"banka", lat:41.02372, lng:28.97530,
    tr:{ ad:"Osmanlı Bankası · SALT Galata", kisa:"İki yüzlü banka binası",
      metin:"Bu görkemli bina, 1892'de Osmanlı Bankası'nın genel merkezi olarak açıldı. Mimarı Alexandre Vallaury'dir ve binanın iki yüzü birbirinden farklıdır: Bankalar Caddesi'ne bakan cephe Avrupai, arka sokağa bakan cephe ise Doğulu bir üslupla tasarlanmıştır. Bu cadde on dokuzuncu yüzyılda imparatorluğun para merkeziydi; bankalar, borsa ve sigorta şirketleri burada sıralanırdı. Bina bugün SALT Galata adıyla kütüphane, arşiv ve sergi alanı olarak kullanılıyor; bodrumdaki eski banka kasaları da gezilebiliyor." },
    en:{ ad:"Ottoman Bank · SALT Galata", kisa:"A bank with two faces",
      metin:"This grand building opened in 1892 as the headquarters of the Ottoman Bank. It was designed by Alexandre Vallaury, and its two sides look nothing alike: the facade on Bankalar Street is European, while the one facing the back street is in an Eastern style. In the nineteenth century this street was the financial heart of the empire, lined with banks, the stock exchange and insurance companies. Today the building is SALT Galata, a library, archive and exhibition space, and the old bank vaults in the basement can be visited." } },
  { id:"arap", lat:41.02305, lng:28.97210,
    tr:{ ad:"Arap Camii", kisa:"Gotik çan kulesinden minare",
      metin:"Galata'nın en eski yapılarından biri olan Arap Camii, aslında on dördüncü yüzyılda Dominiken rahiplerinin yaptırdığı bir kiliseydi. Kare planlı çan kulesi bugün minare olarak kullanılıyor ve İtalyan Gotik izlerini hâlâ taşıyor; İstanbul'da Gotik mimarinin ender örneklerinden biridir. Fatih Sultan Mehmed döneminde camiye çevrildi. 1492'den sonra İspanya'dan kaçan Endülüslü Müslümanların bu çevreye yerleşmesiyle halk arasında Arap Camii diye anılmaya başladı." },
    en:{ ad:"Arap Mosque", kisa:"A minaret that was a Gothic bell tower",
      metin:"One of the oldest buildings in Galata, the Arap Mosque was originally a church built by Dominican friars in the fourteenth century. Its square bell tower now serves as the minaret and still carries traces of Italian Gothic style, a rare example of Gothic architecture in Istanbul. It was converted into a mosque in the time of Mehmed the Conqueror. After 1492, Muslims fleeing Andalusia in Spain settled in the area, and people began calling it the Arab Mosque." } },
  { id:"mevlevi", lat:41.02815, lng:28.97455,
    tr:{ ad:"Galata Mevlevihanesi", kisa:"İstanbul'un ilk Mevlevi dergâhı",
      metin:"Galata Mevlevihanesi, 1491 yılında kurulan ve İstanbul'un ilk Mevlevi dergâhıdır. Dervişlerin semâ ettiği ahşap semâhane, yüzyıllar boyunca müziğin ve şiirin yuvası oldu. Divan edebiyatının son büyük şairlerinden Şeyh Galip burada şeyhlik yaptı ve bahçedeki hazirede yatıyor; önündeki caddeye de adı verildi. Bugün müze olarak açık olan yapıda belirli günlerde semâ gösterileri düzenleniyor." },
    en:{ ad:"Galata Mevlevi Lodge", kisa:"Istanbul's first whirling dervish lodge",
      metin:"Founded in 1491, the Galata Mevlevi Lodge was the first lodge of the Mevlevi order in Istanbul. Its wooden hall, where the dervishes performed their whirling ceremony, was a home of music and poetry for centuries. Şeyh Galip, one of the last great poets of classical Ottoman literature, led the lodge and is buried in its garden; the street in front bears his name. The lodge is now a museum, and whirling ceremonies are held here on certain days." } },
];

const UI = {
  tr:{ eyebrow:"Gezi · İstanbul", intro:"Beş durak, yaklaşık bir saatlik yürüyüş. Durağa gel, dinle.",
       nearest:"En yakın durak", here:"Buradasın", first:"İlk durak", listen:"Dinle", stop:"Durdur", minutes:"dk dinleme",
       read:"Yazısını oku", hide:"Yazıyı gizle", locate:"Konumumu bul", locating:"Konum aranıyor…",
       located:"Konum açık · en yakın durak seçiliyor", far:"Galata'dan uzaktasın; durakları yine de dinleyebilirsin.",
       denied:"Konum izni verilmedi; durağı listeden seçebilirsin.", route:"Rota", stops:"5 durak",
       tabGezi:"Gezi", tabSky:"Gökyüzü", tabShop:"Alışveriş", soon:"Bu bölüm yakında geliyor", away:"uzakta" },
  en:{ eyebrow:"Walk · Istanbul", intro:"Five stops, about an hour's walk. Reach a stop, press play.",
       nearest:"Nearest stop", here:"You are here", first:"First stop", listen:"Listen", stop:"Stop", minutes:"min listen",
       read:"Read the text", hide:"Hide the text", locate:"Find my location", locating:"Finding you…",
       located:"Location on · picking the nearest stop", far:"You're far from Galata, but you can still listen to every stop.",
       denied:"Location wasn't allowed; pick a stop from the list.", route:"Route", stops:"5 stops",
       tabGezi:"Walk", tabSky:"Sky", tabShop:"Shopping", soon:"This section is coming soon", away:"away" }
};

let lang = 'tr';
try{ lang = localStorage.getItem('gep-lang') || ((navigator.language||'tr').startsWith('tr')?'tr':'en'); }catch(e){}
let pos = null, selected = STOPS[0].id, manual = false, storyOpen = false, speaking = false, geoState = 'idle';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dist(a, b){ const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); }
function fmt(m){ return m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(m<10000?1:0).replace('.', lang==='tr'?',':'.')+' km'; }
function minutes(t){ return Math.max(1, Math.round(t.split(/\s+/).length/130)); }

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  $('eyebrow').textContent=u.eyebrow; $('intro').textContent=u.intro;
  $('routeTitle').textContent=u.route; $('routeMeta').textContent=u.stops;
  $('tabGezi').textContent=u.tabGezi;
  $('tabSky').innerHTML=esc(u.tabSky); $('tabShop').innerHTML=esc(u.tabShop);

  const s = STOPS.find(x=>x.id===selected), t = s[lang];
  const d = pos ? dist(pos, s) : null;
  const isHere = d!==null && d < 60;
  const label = isHere ? u.here : (pos && !manual ? u.nearest : (pos ? fmt(d)+' '+u.away : u.first));
  $('now').className = 'card now' + (isHere ? ' here' : '');
  $('now').innerHTML = `
    <div class="tag">${esc(label)}</div>
    <h2>${esc(t.ad)}</h2>
    <div class="meta">${esc(t.kisa)}${d!==null && !isHere ? ' · '+fmt(d) : ''}</div>
    <div class="row">
      <button class="play" id="play" aria-label="${esc(speaking?u.stop:u.listen)}">${speaking
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>'}</button>
      <div class="lbl"><b>${esc(speaking?u.stop:u.listen)}</b><span>${minutes(t.metin)} ${esc(u.minutes)}</span></div>
    </div>
    <div class="story ${storyOpen?'open':''}">${esc(t.metin)}</div>
    <button class="toggle" id="toggle">${esc(storyOpen?u.hide:u.read)}</button>`;
  $('play').onclick = () => speaking ? stopSpeak() : speak(t.metin);
  $('toggle').onclick = () => { storyOpen=!storyOpen; render(); };

  $('locate').style.display = geoState==='on' ? 'none' : 'flex';
  $('locate').innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>${esc(geoState==='wait'?u.locating:u.locate)}`;
  const nearestD = pos ? Math.min(...STOPS.map(x=>dist(pos,x))) : null;
  $('note').textContent = geoState==='denied' ? u.denied : (nearestD!==null && nearestD>3000 ? u.far : (geoState==='on' ? u.located : ''));

  $('route').innerHTML = STOPS.map((x,i)=>`
    <button class="stop ${x.id===selected?'sel':''}" data-id="${x.id}">
      <span class="n">${i+1}</span>
      <span class="t"><b>${esc(x[lang].ad)}</b><span>${esc(x[lang].kisa)}</span></span>
      <span class="d">${pos?fmt(dist(pos,x)):''}</span>
    </button>`).join('');
  document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{
    if(b.dataset.id!==selected){ stopSpeak(); storyOpen=false; }
    selected=b.dataset.id; manual=true; render(); window.scrollTo({top:0,behavior:'smooth'}); });
}

function pickVoice(){
  const vs = speechSynthesis.getVoices(); const want = lang==='tr'?'tr':'en';
  return vs.find(v=>v.lang.toLowerCase().startsWith(want) && /enhanced|premium|yelda|samantha|ava/i.test(v.name))
      || vs.find(v=>v.lang.toLowerCase().startsWith(want));
}
function speak(text){
  if(!('speechSynthesis' in window)) return toast('Ses desteklenmiyor');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang==='tr'?'tr-TR':'en-US'; const v=pickVoice(); if(v) u.voice=v; u.rate = 0.96;
  u.onend = u.onerror = () => { speaking=false; render(); };
  speaking = true; render(); speechSynthesis.speak(u);
}
function stopSpeak(){ if('speechSynthesis' in window) speechSynthesis.cancel(); speaking=false; }

function locate(){
  if(!navigator.geolocation){ geoState='denied'; return render(); }
  geoState='wait'; render();
  navigator.geolocation.watchPosition(p=>{
    pos = {lat:p.coords.latitude, lng:p.coords.longitude}; geoState='on';
    if(!manual && !speaking){ selected = STOPS.reduce((a,b)=>dist(pos,a)<dist(pos,b)?a:b).id; }
    render();
  }, ()=>{ geoState='denied'; render(); }, {enableHighAccuracy:true, maximumAge:10000, timeout:20000});
}

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }

$('locate').onclick = locate;
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{ stopSpeak(); lang=b.dataset.l; try{localStorage.setItem('gep-lang',lang)}catch(e){} render(); });
document.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>toast(UI[lang].soon));
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = ()=>{};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
