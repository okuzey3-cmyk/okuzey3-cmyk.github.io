<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gep Gep">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
<title>Gep Gep</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#c4552d"/><circle cx="256" cy="212" r="94" fill="none" stroke="#f4efe6" stroke-width="32"/><circle cx="256" cy="212" r="30" fill="#f4efe6"/><path d="M350 118V318C350 372 312 398 262 398C232 398 208 388 190 370" fill="none" stroke="#f4efe6" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/></svg>gep gep</div>
    <div class="lang"><button data-l="tr" class="on">TR</button><button data-l="en">EN</button></div>
  </header>

  <!-- ============ GEZİ ============ -->
  <section class="view on" id="v-gezi">
    <div class="hero">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="place">Galata</h1>
      <p id="intro"></p>
    </div>

    <div class="progress" id="progress"></div>
    <div class="card now" id="now"></div>
    <button class="cam-btn" id="camBtn" hidden></button>

    <form class="finder" id="search">
      <button type="button" class="locate" id="locate"></button>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off">
      <button id="qBtn" type="submit"></button>
    </form>
    <p class="note" id="note"></p>

    <div class="block">
      <div class="sh"><h3 id="routeTitle"></h3><span id="routeMeta"></span></div>
      <div class="card route" id="route"></div>
      <div class="twin">
        <button class="ghost" id="saveRoute"></button>
        <button class="ghost" id="resetRoute"></button>
      </div>
    </div>

    <div class="block">
      <div class="sh"><h3 id="mapTitle"></h3><button class="link" id="mapMe"></button></div>
      <div class="card mapcard"><div id="map"></div></div>
      <a class="mapbtn" id="mapBtn" target="_blank" rel="noopener"></a>
    </div>

    <div class="block" id="farBlock">
      <div class="sh"><h3 id="farTitle"></h3><span id="farMeta"></span></div>
      <div class="card route" id="far"></div>
    </div>

    <button class="sample" id="sample"></button>
  </section>

  <!-- ============ GÖKYÜZÜ ============ -->
  <section class="view" id="v-sky">
    <div class="hero">
      <div class="eyebrow" id="skyEyebrow"></div>
      <h1 id="skyTitle"></h1>
      <p id="skyIntro"></p>
    </div>
    <div class="card skycard">
      <canvas id="sky"></canvas>
      <div class="reticle"></div>
      <div class="skydir" id="skyDir"></div>
      <div class="skyhint" id="skyHint"></div>
    </div>
    <button class="cam-btn" id="skyStart"></button>
    <div class="card skyinfo" id="skyNow"></div>
    <div class="block">
      <div class="sh"><h3 id="skyListTitle"></h3><span id="skyListMeta"></span></div>
      <div class="card route" id="skyList"></div>
    </div>
    <div class="block">
      <div class="sh"><h3 id="moonTitle"></h3></div>
      <div class="card moon" id="moon"></div>
    </div>
  </section>

  <!-- ============ ALIŞVERİŞ ============ -->
  <section class="view" id="v-shop">
    <div class="hero">
      <div class="eyebrow" id="shopEyebrow"></div>
      <h1 id="shopTitle"></h1>
      <p id="shopIntro"></p>
    </div>
    <div class="stage" aria-hidden="true"><i class="k k1"></i><i class="k k2"></i><i class="k k3"></i><i class="k k4"></i><span class="beam"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg></div>
    <button class="cam-btn big" id="shopScan"></button>
    <div id="shopResult"></div>
    <div class="block" id="shopHistBlock">
      <div class="sh"><h3 id="shopHistTitle"></h3><span id="shopHistMeta"></span></div>
      <div class="card route" id="shopHist"></div>
    </div>
    <p class="fine" id="shopFine"></p>
  </section>

  <!-- ============ GÜNLÜK ============ -->
  <section class="view" id="v-log">
    <div class="hero">
      <div class="eyebrow" id="logEyebrow"></div>
      <h1 id="logTitle"></h1>
      <p id="logIntro"></p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="block">
      <div class="sh"><h3 id="savedTitle"></h3><span id="savedMeta"></span></div>
      <div class="card route" id="saved"></div>
    </div>
    <div class="block">
      <div class="sh"><h3 id="visitTitle"></h3><span id="visitMeta"></span></div>
      <div class="card route" id="visits"></div>
    </div>
    <div class="block">
      <div class="sh"><h3 id="seenTitle"></h3><span id="seenMeta"></span></div>
      <div class="card route" id="seen"></div>
    </div>
    <div class="block">
      <div class="sh"><h3 id="setTitle"></h3></div>
      <div class="card settings" id="settings"></div>
    </div>
  </section>
</div>

<footer class="foot"><button id="legalLink" type="button"></button></footer>
<nav><div class="in">
  <button data-tab="gezi" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span id="tabGezi"></span></button>
  <button data-tab="sky"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span id="tabSky"></span></button>
  <i class="gap"></i>
  <button data-tab="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg><span id="tabShop"></span></button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg><span id="tabLog"></span></button>
</div></nav>
<button class="fab" id="fab" aria-label="Kamera"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="12.5" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="24" r="4.2" fill="currentColor"/></svg></button>

<div class="toast" id="toast"></div>

<div class="ob" id="ob" hidden></div>

<!-- Kamera katmanı (Gezi ve Alışveriş ortak kullanır) -->
<div class="cam" id="cam">
  <video id="video" playsinline muted autoplay></video>
  <img class="shot" id="shot" alt="">
  <div class="frame"></div>
  <div class="scan"><span><i></i><b id="scanTxt"></b></span></div>
  <div class="top">
    <button class="x" id="camClose" aria-label="Kapat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span class="hint" id="camHint"></span>
    <button class="x" id="camKey" aria-label="Anahtar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg></button>
  </div>
  <div class="bottom"><button class="shutter" id="shutter" aria-label="Çek"></button></div>
  <div class="sheet" id="sheet"></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/astronomy.browser.min.js"></script>
<script src="js/config.js"></script>
<script src="js/galata.js"></script>
<script src="js/core.js"></script>
<script src="js/paylas.js"></script>
<script src="js/kamera.js"></script>
<script src="js/gezi.js"></script>
<script src="js/gokyuzu.js"></script>
<script src="js/alisveris.js"></script>
<script src="js/gunluk.js"></script>
<script src="js/acilis.js"></script>
<script src="js/tema.js"></script>
<script>App.start(); Onb.start();
document.getElementById('legalLink').textContent=(typeof lang!=='undefined'&&lang==='en')?'Privacy & sources':'Gizlilik ve kaynaklar';
document.getElementById('legalLink').onclick=function(){openLegal();};
document.getElementById('fab').onclick=function(){
  var on=(document.querySelector('nav button.on')||{dataset:{}}).dataset.tab;
  if(on==='log'){ App.show('gezi'); on='gezi'; }
  document.getElementById(on==='shop'?'shopScan':on==='sky'?'skyStart':'camBtn').click();
};</script>
</body>
</html>
